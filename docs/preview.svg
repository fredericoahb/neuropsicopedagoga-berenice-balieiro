    <rect x="1020" y="1180" width="160" height="100" rx="16" fill="white" stroke="#f3f4f6" stroke-width="1" filter="url(#shadow2)"/>
    <circle cx="1100" cy="1218" r="18" fill="#eef9ff"/><circle cx="1100" cy="1218" r="8" fill="#2196F3" opacity="0.5"/>
    <text x="1100" y="1262" font-family="system-ui" font-size="12" fill="#1a2332" text-anchor="middle" font-weight="700">Linguagem</text>
