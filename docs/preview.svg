  <text x="80" y="1190" font-family="system-ui" font-size="11" fill="#0da3a3" letter-spacing="3" font-weight="700">NEUROPSICOPEDAGOGIA</text>
  <text x="80" y="1230" font-family="Georgia, serif" font-size="30" fill="#1a2332">O cérebro precisa de</text>
  <text x="80" y="1266" font-family="Georgia, serif" font-size="30" fill="#2196F3">estratégia para aprender</text>
  <text x="80" y="1310" font-family="system-ui" font-size="14" fill="#6b7280">A neuropsicopedagogia clínica investiga a relação</text>
  <text x="80" y="1332" font-family="system-ui" font-size="14" fill="#6b7280">entre cérebro, aprendizagem e comportamento.</text>

