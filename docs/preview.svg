    <circle cx="820" cy="872" r="8" fill="#2196F3" opacity="0.6"/>
    <text x="800" y="914" font-family="system-ui" font-size="13" fill="#1a2332" font-weight="600">"Demora muito para fazer as tarefas."</text>
