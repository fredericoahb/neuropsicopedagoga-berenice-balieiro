  <!-- Decorative circles -->
  <circle cx="200" cy="250" r="200" fill="#2196F3" opacity="0.03"/>
  <circle cx="900" cy="400" r="160" fill="#14ccc7" opacity="0.04"/>

  <!-- Badge -->
  <rect x="80" y="180" width="250" height="30" rx="15" fill="#edfffe" stroke="#d1fffe" stroke-width="1"/>
  <circle cx="100" cy="195" r="5" fill="#14ccc7"/>
  <text x="115" y="200" font-family="system-ui" font-size="12" fill="#0da3a3" font-weight="600">Neuropsicopedagogia Clínica</text>

  <!-- Hero Title -->
  <text x="80" y="260" font-family="Georgia, serif" font-size="38" fill="#1a2332">Quando aprender vira um desafio,</text>
  <text x="80" y="308" font-family="Georgia, serif" font-size="38" fill="#2196F3">o cérebro precisa de estratégia</text>
  <text x="80" y="356" font-family="Georgia, serif" font-size="38" fill="#1a2332">— não de culpa.</text>

  <!-- Subtitle -->
  <text x="80" y="400" font-family="system-ui" font-size="16" fill="#6b7280">Muitas crianças enfrentam dificuldades na escola não por falta de</text>
  <text x="80" y="424" font-family="system-ui" font-size="16" fill="#6b7280">inteligência, mas porque alguns processos cognitivos precisam de apoio.</text>

  <!-- CTA Buttons -->
  <rect x="80" y="460" width="220" height="50" rx="25" fill="url(#brandGrad)" filter="url(#shadow1)"/>
  <text x="160" y="490" font-family="system-ui" font-size="15" fill="white" font-weight="700">Agendar Avaliação  →</text>
  <rect x="320" y="460" width="180" height="50" rx="25" fill="none" stroke="#bce8ff" stroke-width="1.5"/>
  <text x="370" y="490" font-family="system-ui" font-size="15" fill="#1565C0" font-weight="500">Como funciona</text>

  <!-- Hero illustration card -->
  <rect x="700" y="160" width="400" height="400" rx="40" fill="white" fill-opacity="0.6" stroke="white" stroke-width="2" filter="url(#shadow2)"/>
  <!-- Brain icon large -->
  <circle cx="900" cy="330" r="80" fill="#2196F3" opacity="0.12"/>
  <circle cx="900" cy="320" r="50" fill="#2196F3"/>
  <path d="M880 310 Q890 295 910 300 Q925 305 920 320 Q930 310 925 330 Q920 340 905 338 Q895 340 885 335 Q875 325 880 310Z" fill="#1565C0" opacity="0.3"/>
