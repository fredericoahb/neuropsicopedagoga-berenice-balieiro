  <!-- Pain cards row 2 -->
  <g>
    <rect x="80" y="960" width="330" height="110" rx="16" fill="#f9fafb" stroke="#f3f4f6" stroke-width="1"/>
    <rect x="100" y="982" width="40" height="40" rx="10" fill="#eef9ff"/>
    <circle cx="120" cy="1002" r="8" fill="#2196F3" opacity="0.6"/>
    <text x="100" y="1044" font-family="system-ui" font-size="13" fill="#1a2332" font-weight="600">"Fica frustrado quando precisa estudar."</text>
