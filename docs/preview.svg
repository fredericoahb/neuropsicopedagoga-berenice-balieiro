  <circle cx="100" cy="34" r="10" fill="#2196F3"/>
  <text x="128" y="32" font-family="Georgia, serif" font-size="17" fill="#1a2332" font-weight="bold">Berenice Balieiro</text>
  <text x="128" y="48" font-family="system-ui" font-size="9" fill="#2196F3" letter-spacing="2">NEUROPSICOPEDAGOGA</text>
  <!-- CTA button navbar -->
