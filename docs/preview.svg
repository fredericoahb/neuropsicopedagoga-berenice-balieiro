  <text x="600" y="1610" font-family="system-ui" font-size="11" fill="#0da3a3" letter-spacing="3" font-weight="700" text-anchor="middle">O PROCESSO</text>
  <text x="600" y="1650" font-family="Georgia, serif" font-size="30" fill="#1a2332" text-anchor="middle">Como funciona o <tspan fill="#2196F3">atendimento</tspan></text>

