  <g>
    <rect x="840" y="1300" width="160" height="100" rx="16" fill="white" stroke="#f3f4f6" stroke-width="1" filter="url(#shadow2)"/>
    <circle cx="920" cy="1338" r="18" fill="#eef9ff"/><circle cx="920" cy="1338" r="8" fill="#2196F3" opacity="0.5"/>
    <text x="920" y="1382" font-family="system-ui" font-size="12" fill="#1a2332" text-anchor="middle" font-weight="700">Planejamento</text>
