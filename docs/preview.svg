  <circle cx="1020" cy="232" r="8" fill="#14ccc7" opacity="0.3"/>
  <text x="1036" y="237" font-family="system-ui" font-size="11" fill="#1a2332" font-weight="600">Funções Executivas</text>
  <rect x="680" y="430" width="160" height="44" rx="14" fill="white" filter="url(#shadow2)"/>
  <circle cx="700" cy="452" r="8" fill="#2196F3" opacity="0.3"/>
  <text x="716" y="457" font-family="system-ui" font-size="11" fill="#1a2332" font-weight="600">Avaliação Cognitiva</text>

  <!-- Wave divider -->
  <path d="M0 640 C300 680 600 620 900 650 C1050 665 1150 655 1200 645 L1200 660 L0 660Z" fill="white"/>

  <!-- ========== PAIN SECTION ========== -->
  <rect y="652" width="1200" height="480" fill="white"/>
  <text x="80" y="710" font-family="system-ui" font-size="11" fill="#0da3a3" letter-spacing="3" font-weight="700">VOCÊ RECONHECE ISSO?</text>
  <text x="80" y="752" font-family="Georgia, serif" font-size="32" fill="#1a2332">Seu filho é inteligente, mas aprender</text>
  <text x="80" y="790" font-family="Georgia, serif" font-size="32" fill="#2196F3">parece muito difícil?</text>

  <!-- Pain cards row 1 -->
  <g>
    <rect x="80" y="830" width="330" height="110" rx="16" fill="#f9fafb" stroke="#f3f4f6" stroke-width="1"/>
    <rect x="100" y="852" width="40" height="40" rx="10" fill="#eef9ff"/>
    <circle cx="120" cy="872" r="8" fill="#2196F3" opacity="0.6"/>
    <text x="100" y="914" font-family="system-ui" font-size="13" fill="#1a2332" font-weight="600">"Ele é inteligente, mas não presta atenção."</text>
  </g>
  <g>
    <rect x="430" y="830" width="330" height="110" rx="16" fill="#f9fafb" stroke="#f3f4f6" stroke-width="1"/>
    <rect x="450" y="852" width="40" height="40" rx="10" fill="#eef9ff"/>
    <circle cx="470" cy="872" r="8" fill="#2196F3" opacity="0.6"/>
    <text x="450" y="914" font-family="system-ui" font-size="13" fill="#1a2332" font-weight="600">"Ela esquece tudo que aprende."</text>
