    <line x1="444" y1="1818" x2="444" y2="1850" stroke="#2196F3" stroke-width="2" opacity="0.3"/>
    <text x="486" y="1792" font-family="Georgia, serif" font-size="17" fill="#1a2332">Avaliação Cognitiva</text>
    <text x="486" y="1814" font-family="system-ui" font-size="12" fill="#9ca3af">Sessões com instrumentos especializados</text>
  </g>
  <g>
    <rect x="420" y="1850" width="48" height="48" rx="14" fill="url(#brandGrad)" filter="url(#shadow1)"/>
    <text x="444" y="1880" font-family="Georgia, serif" font-size="16" fill="white" text-anchor="middle">03</text>
    <line x1="444" y1="1898" x2="444" y2="1930" stroke="#2196F3" stroke-width="2" opacity="0.3"/>
