    <circle cx="1100" cy="1338" r="18" fill="#edfffe"/><circle cx="1100" cy="1338" r="8" fill="#14ccc7" opacity="0.5"/>
    <text x="1100" y="1382" font-family="system-ui" font-size="12" fill="#1a2332" text-anchor="middle" font-weight="700">Reg. Emocional</text>
