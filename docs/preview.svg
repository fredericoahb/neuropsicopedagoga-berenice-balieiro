    <filter id="shadow2" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.06"/>
    </filter>
    <clipPath id="rounded16"><rect width="1200" height="2800" rx="16"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="2800" fill="#fafcff" clip-path="url(#rounded16)"/>

  <!-- ========== NAVBAR ========== -->
  <rect width="1200" height="72" fill="white" fill-opacity="0.92"/>
  <rect x="0" y="71" width="1200" height="1" fill="#e5e7eb" opacity="0.5"/>
  <!-- Brain icon placeholder -->
