<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2800" fill="none">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1200" y2="700">
      <stop offset="0%" stop-color="#f0f7ff"/>
      <stop offset="50%" stop-color="#f5fcff"/>
      <stop offset="100%" stop-color="#edfffe"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2196F3"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14ccc7"/>
      <stop offset="100%" stop-color="#0da3a3"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1722"/>
      <stop offset="100%" stop-color="#1a2332"/>
