  <circle cx="600" cy="2468" r="12" fill="#2196F3" opacity="0.4"/>
  <text x="600" y="2530" font-family="Georgia, serif" font-size="28" fill="#1a2332" text-anchor="middle">Quando entendemos como o cérebro aprende,</text>
  <text x="600" y="2566" font-family="Georgia, serif" font-size="28" fill="#2196F3" text-anchor="middle">novos caminhos se tornam possíveis.</text>
