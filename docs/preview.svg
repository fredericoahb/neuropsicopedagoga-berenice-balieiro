    <text x="486" y="1712" font-family="Georgia, serif" font-size="17" fill="#1a2332">Entrevista Inicial</text>
    <text x="486" y="1734" font-family="system-ui" font-size="12" fill="#9ca3af">Conversa com os responsáveis sobre a criança</text>
