    <text x="128" y="2237" font-family="system-ui" font-size="12" fill="#e5e7eb" font-weight="500">Crianças com dificuldade de aprendizagem</text>
  </g>
  <g>
    <rect x="440" y="2210" width="300" height="44" rx="12" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.1"/>
    <circle cx="468" cy="2232" r="8" fill="#6bf7f1" opacity="0.6"/>
    <text x="488" y="2237" font-family="system-ui" font-size="12" fill="#e5e7eb" font-weight="500">Suspeita de TDAH</text>
  </g>
  <g>
    <rect x="760" y="2210" width="340" height="44" rx="12" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.1"/>
    <circle cx="788" cy="2232" r="8" fill="#6bf7f1" opacity="0.6"/>
    <text x="808" y="2237" font-family="system-ui" font-size="12" fill="#e5e7eb" font-weight="500">Dificuldade de atenção e memória</text>
  </g>
  <g>
