<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" fill="none">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="800" y2="480">
      <stop offset="0%" stop-color="#f8faf9"/><stop offset="50%" stop-color="#f0f5f2"/><stop offset="100%" stop-color="#eaf2ee"/>
    </linearGradient>
    <linearGradient id="brandG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d6a6c"/><stop offset="100%" stop-color="#245758"/>
    </linearGradient>
    <linearGradient id="warmG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf8f5"/><stop offset="100%" stop-color="#f4efe8"/>
    </linearGradient>
    <filter id="sh" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#2d6a6c" flood-opacity="0.08"/>
    </filter>
    <clipPath id="browser"><rect width="800" height="480" rx="12"/></clipPath>
    <clipPath id="viewport"><rect y="36" width="800" height="444"/></clipPath>
  </defs>

  <g clip-path="url(#browser)">
    <!-- Title bar -->
    <rect width="800" height="36" fill="#1e2d3d" rx="12"/>
    <rect y="12" width="800" height="24" fill="#1e2d3d"/>
    <circle cx="20" cy="18" r="5.5" fill="#ff5f57"/>
    <circle cx="38" cy="18" r="5.5" fill="#febc2e"/>
    <circle cx="56" cy="18" r="5.5" fill="#28c840"/>
    <rect x="80" y="8" width="640" height="20" rx="6" fill="#141f2b"/>
    <text x="110" y="22" font-family="system-ui,sans-serif" font-size="10" fill="#7ca28b">berenicebalieiro.com.br</text>

    <!-- Scrolling content -->
    <g clip-path="url(#viewport)">
      <g>
        <animateTransform attributeName="transform" type="translate"
          values="0,0; 0,0; 0,-460; 0,-460; 0,-920; 0,-920; 0,-1380; 0,-1380; 0,-1840; 0,-1840; 0,0"
          dur="20s" repeatCount="indefinite" keyTimes="0;0.08;0.18;0.26;0.36;0.44;0.54;0.62;0.72;0.92;1"/>

        <!-- ═══ HERO ═══ -->
        <rect y="36" width="800" height="460" fill="url(#heroBg)"/>
        <circle cx="120" cy="200" r="140" fill="#2d6a6c" opacity="0.03"/>
        <circle cx="650" cy="350" r="100" fill="#7ca28b" opacity="0.03"/>
        <rect x="60" y="120" width="230" height="26" rx="13" fill="#eef5f1" stroke="#d4e8db"/>
        <text x="82" y="138" font-family="system-ui,sans-serif" font-size="10" fill="#3d7252" font-weight="600">✦  Crianças · Adultos · Idosos</text>
        <text x="60" y="190" font-family="system-ui,sans-serif" font-size="28" fill="#1e2d3d" font-weight="700">Nem toda dificuldade é falta</text>
        <text x="60" y="224" font-family="system-ui,sans-serif" font-size="28" fill="#1e2d3d" font-weight="700">de esforço.</text>
        <text x="60" y="264" font-family="system-ui,sans-serif" font-size="28" fill="#2d6a6c" font-weight="700">Muitas são sinais que ainda</text>
        <text x="60" y="298" font-family="system-ui,sans-serif" font-size="28" fill="#2d6a6c" font-weight="700">não foram interpretados.</text>
        <text x="60" y="338" font-family="system-ui,sans-serif" font-size="13" fill="#5a6b72">A neuropsicopedagogia investiga como o cérebro aprende,</text>
        <text x="60" y="356" font-family="system-ui,sans-serif" font-size="13" fill="#5a6b72">se organiza e regula emoções.</text>
        <rect x="60" y="382" width="195" height="42" rx="21" fill="url(#brandG)" filter="url(#sh)">
          <animate attributeName="width" values="195;200;195" dur="3s" repeatCount="indefinite"/>
        </rect>
        <text x="110" y="408" font-family="system-ui,sans-serif" font-size="12.5" fill="white" font-weight="700">Agendar Avaliação  →</text>
        <rect x="270" y="382" width="175" height="42" rx="21" fill="none" stroke="#b8d4c8" stroke-width="1.5"/>
        <text x="300" y="408" font-family="system-ui,sans-serif" font-size="12.5" fill="#2d6a6c" font-weight="600">Você reconhece isso?</text>
        <!-- Hero card -->
        <rect x="530" y="110" width="230" height="280" rx="28" fill="white" fill-opacity="0.5" stroke="white" stroke-width="1.5" filter="url(#sh)"/>
        <circle cx="645" cy="230" r="55" fill="#2d6a6c" opacity="0.08"/>
        <circle cx="625" cy="215" r="6" fill="#2d6a6c" opacity="0.5"/>
        <circle cx="655" cy="205" r="8" fill="#2d6a6c" opacity="0.6"/>
        <circle cx="670" cy="235" r="5" fill="#2d6a6c" opacity="0.4"/>
        <circle cx="640" cy="250" r="7" fill="#2d6a6c" opacity="0.5"/>
        <circle cx="615" cy="240" r="4" fill="#2d6a6c" opacity="0.3"/>
        <line x1="625" y1="215" x2="655" y2="205" stroke="#2d6a6c" stroke-width="1" opacity="0.3"/>
        <line x1="655" y1="205" x2="670" y2="235" stroke="#2d6a6c" stroke-width="1" opacity="0.3"/>
        <line x1="670" y1="235" x2="640" y2="250" stroke="#2d6a6c" stroke-width="1" opacity="0.3"/>
        <line x1="640" y1="250" x2="615" y2="240" stroke="#2d6a6c" stroke-width="1" opacity="0.3"/>
        <line x1="615" y1="240" x2="625" y2="215" stroke="#2d6a6c" stroke-width="1" opacity="0.3"/>
        <rect x="680" y="140" width="130" height="34" rx="10" fill="white" filter="url(#sh)"/>
        <text x="700" y="162" font-family="system-ui,sans-serif" font-size="9" fill="#1e2d3d" font-weight="600">⚡ Funções Executivas</text>
        <rect x="510" y="340" width="135" height="34" rx="10" fill="white" filter="url(#sh)"/>
        <text x="528" y="362" font-family="system-ui,sans-serif" font-size="9" fill="#1e2d3d" font-weight="600">🧠 Reabilitação Cognitiva</text>

        <!-- ═══ PAIN SECTION ═══ -->
        <rect y="496" width="800" height="460" fill="white"/>
        <text x="60" y="550" font-family="system-ui,sans-serif" font-size="9" fill="#3d7252" font-weight="700" letter-spacing="3">VOCÊ RECONHECE ISSO?</text>
        <text x="60" y="586" font-family="system-ui,sans-serif" font-size="24" fill="#1e2d3d" font-weight="700">Situações que parecem comuns — mas</text>
        <text x="60" y="616" font-family="system-ui,sans-serif" font-size="24" fill="#1e2d3d" font-weight="700">podem ser <tspan fill="#2d6a6c">sinais importantes</tspan></text>
        <!-- Cards -->
        <rect x="60" y="650" width="215" height="250" rx="16" fill="#f4f7f2" stroke="#e8ede4"/>
        <rect x="78" y="670" width="36" height="36" rx="8" fill="#eef5f1"/>
        <text x="96" y="694" font-family="system-ui,sans-serif" font-size="16" text-anchor="middle" fill="#2d6a6c">👶</text>
        <text x="122" y="694" font-family="system-ui,sans-serif" font-size="14" fill="#1e2d3d" font-weight="700">Crianças</text>
        <text x="78" y="726" font-family="system-ui,sans-serif" font-size="10" fill="#5a6b72" font-style="italic">— "Não presta atenção."</text>
        <text x="78" y="754" font-family="system-ui,sans-serif" font-size="10" fill="#5a6b72" font-style="italic">— "Esquece tudo que aprende."</text>
        <text x="78" y="782" font-family="system-ui,sans-serif" font-size="10" fill="#5a6b72" font-style="italic">— "Fica frustrado ao estudar."</text>

        <rect x="293" y="650" width="215" height="250" rx="16" fill="#f4f7f2" stroke="#e8ede4"/>
        <rect x="311" y="670" width="36" height="36" rx="8" fill="#eef5f1"/>
        <text x="329" y="694" font-family="system-ui,sans-serif" font-size="16" text-anchor="middle" fill="#2d6a6c">🧑</text>
        <text x="355" y="694" font-family="system-ui,sans-serif" font-size="14" fill="#1e2d3d" font-weight="700">Adultos</text>
        <text x="311" y="726" font-family="system-ui,sans-serif" font-size="10" fill="#5a6b72" font-style="italic">— "Não consegue se organizar."</text>
        <text x="311" y="754" font-family="system-ui,sans-serif" font-size="10" fill="#5a6b72" font-style="italic">— "Procrastina sem parar."</text>
        <text x="311" y="782" font-family="system-ui,sans-serif" font-size="10" fill="#5a6b72" font-style="italic">— "Sobrecarga mental."</text>

        <rect x="526" y="650" width="215" height="250" rx="16" fill="#f4f7f2" stroke="#e8ede4"/>
        <rect x="544" y="670" width="36" height="36" rx="8" fill="#eef5f1"/>
        <text x="562" y="694" font-family="system-ui,sans-serif" font-size="16" text-anchor="middle" fill="#2d6a6c">❤</text>
        <text x="588" y="694" font-family="system-ui,sans-serif" font-size="14" fill="#1e2d3d" font-weight="700">Idosos</text>
        <text x="544" y="726" font-family="system-ui,sans-serif" font-size="10" fill="#5a6b72" font-style="italic">— "Esquece com frequência."</text>
        <text x="544" y="754" font-family="system-ui,sans-serif" font-size="10" fill="#5a6b72" font-style="italic">— "Perde o fio da conversa."</text>
        <text x="544" y="782" font-family="system-ui,sans-serif" font-size="10" fill="#5a6b72" font-style="italic">— "Não sabe como ajudar."</text>

        <!-- ═══ BELIEF BREAK ═══ -->
        <rect y="956" width="800" height="460" fill="url(#warmG)"/>
        <text x="400" y="1140" font-family="system-ui,sans-serif" font-size="22" fill="#1e2d3d" font-weight="700" text-anchor="middle">O problema pode não ser falta de</text>
        <text x="400" y="1170" font-family="system-ui,sans-serif" font-size="22" fill="#1e2d3d" font-weight="700" text-anchor="middle">disciplina, preguiça ou idade.</text>
        <text x="400" y="1210" font-family="system-ui,sans-serif" font-size="13" fill="#5a6b72" text-anchor="middle">Pode ser sobrecarga cognitiva, uma falha em funções executivas</text>
        <text x="400" y="1230" font-family="system-ui,sans-serif" font-size="13" fill="#5a6b72" text-anchor="middle">ou uma dificuldade que ninguém investigou.</text>
        <text x="400" y="1270" font-family="system-ui,sans-serif" font-size="15" fill="#2d6a6c" font-weight="700" text-anchor="middle">Entender a causa muda tudo.</text>

        <!-- ═══ SCIENCE ═══ -->
        <rect y="1416" width="800" height="460" fill="white"/>
        <text x="60" y="1470" font-family="system-ui,sans-serif" font-size="9" fill="#3d7252" font-weight="700" letter-spacing="3">POR QUE ISSO ACONTECE</text>
        <text x="60" y="1508" font-family="system-ui,sans-serif" font-size="22" fill="#1e2d3d" font-weight="700">O cérebro depende de <tspan fill="#2d6a6c">funções</tspan></text>
        <text x="60" y="1536" font-family="system-ui,sans-serif" font-size="22" fill="#2d6a6c" font-weight="700">cognitivas para funcionar</text>
        <text x="60" y="1575" font-family="system-ui,sans-serif" font-size="12" fill="#5a6b72">Quando essas funções não operam bem,</text>
        <text x="60" y="1593" font-family="system-ui,sans-serif" font-size="12" fill="#5a6b72">surgem dificuldades que parecem</text>
        <text x="60" y="1611" font-family="system-ui,sans-serif" font-size="12" fill="#5a6b72">comportamentais — mas têm origem</text>
        <text x="60" y="1629" font-family="system-ui,sans-serif" font-size="12" fill="#5a6b72">neurológica.</text>
        <!-- Cards -->
        <rect x="460" y="1460" width="145" height="75" rx="14" fill="#f4f7f2" stroke="#e8ede4" filter="url(#sh)"/>
        <text x="490" y="1505" font-family="system-ui,sans-serif" font-size="11" fill="#1e2d3d" font-weight="700">👁 Atenção</text>
        <rect x="620" y="1460" width="145" height="75" rx="14" fill="#f4f7f2" stroke="#e8ede4" filter="url(#sh)"/>
        <text x="650" y="1505" font-family="system-ui,sans-serif" font-size="11" fill="#1e2d3d" font-weight="700">🧠 Memória</text>
        <rect x="460" y="1550" width="145" height="75" rx="14" fill="#f4f7f2" stroke="#e8ede4" filter="url(#sh)"/>
        <text x="490" y="1595" font-family="system-ui,sans-serif" font-size="11" fill="#1e2d3d" font-weight="700">💬 Linguagem</text>
        <rect x="620" y="1550" width="145" height="75" rx="14" fill="#f4f7f2" stroke="#e8ede4" filter="url(#sh)"/>
        <text x="650" y="1595" font-family="system-ui,sans-serif" font-size="11" fill="#1e2d3d" font-weight="700">💡 Raciocínio</text>
        <rect x="460" y="1640" width="145" height="75" rx="14" fill="#f4f7f2" stroke="#e8ede4" filter="url(#sh)"/>
        <text x="490" y="1685" font-family="system-ui,sans-serif" font-size="11" fill="#1e2d3d" font-weight="700">📁 Organização</text>
        <rect x="620" y="1640" width="145" height="75" rx="14" fill="#f4f7f2" stroke="#e8ede4" filter="url(#sh)"/>
        <text x="650" y="1685" font-family="system-ui,sans-serif" font-size="11" fill="#1e2d3d" font-weight="700">❤ Reg. Emocional</text>

        <!-- ═══ CTA FINAL ═══ -->
        <rect y="1876" width="800" height="460" fill="url(#heroBg)"/>
        <text x="400" y="2060" font-family="system-ui,sans-serif" font-size="22" fill="#1e2d3d" font-weight="700" text-anchor="middle">Quando entendemos o que está</text>
        <text x="400" y="2090" font-family="system-ui,sans-serif" font-size="22" fill="#1e2d3d" font-weight="700" text-anchor="middle">por trás da dificuldade,</text>
        <text x="400" y="2128" font-family="system-ui,sans-serif" font-size="22" fill="#2d6a6c" font-weight="700" text-anchor="middle">o caminho fica mais claro.</text>
        <text x="400" y="2175" font-family="system-ui,sans-serif" font-size="13" fill="#5a6b72" text-anchor="middle">Uma avaliação especializada pode ser o primeiro passo.</text>
        <text x="400" y="2210" font-family="system-ui,sans-serif" font-size="14" fill="#2d6a6c" font-weight="700" text-anchor="middle">Você não precisa ter certeza. Precisa apenas dar o primeiro passo.</text>
        <rect x="245" y="2240" width="195" height="44" rx="22" fill="url(#brandG)" filter="url(#sh)">
          <animate attributeName="width" values="195;200;195" dur="3s" repeatCount="indefinite"/>
        </rect>
        <text x="295" y="2267" font-family="system-ui,sans-serif" font-size="12" fill="white" font-weight="700">Agendar Avaliação  →</text>
        <rect x="460" y="2240" width="165" height="44" rx="22" fill="#25D366"/>
        <text x="502" y="2267" font-family="system-ui,sans-serif" font-size="12" fill="white" font-weight="700">WhatsApp</text>
      </g>
    </g>

    <!-- Fixed navbar -->
    <rect y="36" width="800" height="48" fill="white" fill-opacity="0.94"/>
    <rect y="83" width="800" height="1" fill="#e8ede4" opacity="0.5"/>
    <circle cx="76" cy="60" r="14" fill="#eef5f1" stroke="#d4e8db"/>
    <circle cx="76" cy="58" r="7" fill="#2d6a6c" opacity="0.6"/>
    <text x="98" y="57" font-family="system-ui,sans-serif" font-size="12" fill="#1e2d3d" font-weight="700">Berenice Balieiro</text>
    <text x="98" y="70" font-family="system-ui,sans-serif" font-size="7" fill="#2d6a6c" letter-spacing="2" font-weight="600">NEUROPSICOPEDAGOGA CLÍNICA</text>
    <rect x="620" y="46" width="120" height="28" rx="14" fill="url(#brandG)"/>
    <text x="652" y="64" font-family="system-ui,sans-serif" font-size="10" fill="white" font-weight="700">Agendar</text>

    <!-- WhatsApp float -->
    <circle cx="755" cy="440" r="22" fill="#25D366" filter="url(#sh)">
      <animate attributeName="r" values="22;24;22" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="755" y="446" font-family="system-ui,sans-serif" font-size="16" fill="white" text-anchor="middle">W</text>
  </g>
</svg>
